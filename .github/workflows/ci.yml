name: Hulane OpenCode CI
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
permissions:
  contents: read
jobs:
  core-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax
        run: npm run check:syntax
      - name: Core and regression tests
        run: npm test

  opencode-v2-adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install V2 plugin dependency
        run: npm install --no-audit --no-fund
      - name: Show SDK version
        run: npm ls @opencode/plugin --depth=0
      - name: Test V2 native Plugin.define and hook registration
        run: node --experimental-strip-types tests/sdk-smoke.mjs

  opencode-cli-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install plugin dependencies
        run: npm install --no-audit --no-fund
      - name: Install real OpenCode V2 CLI
        run: npm install -g @opencode/cli
      - name: Verify executable and version
        run: opencode --version
      - name: Install into isolated project and validate startup
        shell: bash
        run: |
          set -euo pipefail
          TEST_REPO="$(mktemp -d)"
          git -C "$TEST_REPO" init -q
          git -C "$TEST_REPO" config user.name "OpenCode CI"
          git -C "$TEST_REPO" config user.email "opencode-ci@example.invalid"
          echo "temporary target project" > "$TEST_REPO/README.md"
          git -C "$TEST_REPO" add README.md
          git -C "$TEST_REPO" commit -qm initial
          node bin/install.mjs --project "$TEST_REPO"
          cd "$TEST_REPO"
          export OPENCODE_CONFIG="$TEST_REPO/opencode.json"
          echo "Config loaded from: $OPENCODE_CONFIG"
          cat "$OPENCODE_CONFIG"
          # Keep one real V2 server alive so initial async plugins/MCP can activate.
          opencode serve --hostname 127.0.0.1 --port 43987 > "$TEST_REPO/server.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for retry in {1..20}; do
            if curl --silent --fail http://127.0.0.1:43987/global/health >/dev/null; then break; fi
            sleep 0.5
          done
          opencode --server http://127.0.0.1:43987 debug config | tee "$TEST_REPO/effective-config.txt"
          opencode --server http://127.0.0.1:43987 plugin list --builtin | tee "$TEST_REPO/plugin-list.txt"
          grep -i 'opencode.config.mcp' "$TEST_REPO/plugin-list.txt"
          grep -i 'hulane' "$TEST_REPO/plugin-list.txt"
          opencode --server http://127.0.0.1:43987 mcp list | tee "$TEST_REPO/mcp-list.txt"
          grep -i 'hulane-control' "$TEST_REPO/mcp-list.txt"
