name: Workbench 28 Issues progress
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: read
  pull-requests: read
  actions: read
jobs:
  progress:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Monitor unit tests
        run: node --test test/workbench-progress.test.mjs
      - name: Check all 28 Workbench issues, PRs and recent CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: node bin/workbench-progress.mjs
