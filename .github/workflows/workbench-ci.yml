name: Workbench CI (bootstrap)
on:
  pull_request:
    paths:
      - 'workbench/**'
      - '.github/workflows/workbench-ci.yml'
  push:
    paths:
      - 'workbench/**'
      - '.github/workflows/workbench-ci.yml'
permissions:
  contents: read
jobs:
  workbench:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install (temporary bootstrap; lockfile pending)
        working-directory: workbench
        run: npm install --no-audit --no-fund
      - name: Typecheck
        working-directory: workbench
        run: npm run typecheck
      - name: Build
        working-directory: workbench
        run: npm run build
      - name: API tests
        working-directory: workbench
        run: npm test
